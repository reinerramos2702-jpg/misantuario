name = "misantuario"
main = "worker/index.js"
compatibility_date = "2024-09-23"
# nodejs_compat: @block65/webcrypto-web-push (Bloque 6, envío de Web Push real) importa
# "node:crypto" como fallback interno; sin este flag, wrangler deploy avisa que no puede
# resolver ese import y la firma VAPID fallaría en runtime la primera vez que exista una
# suscripción real que enviar (antes no se notaba porque push_subscriptions estaba vacía).
compatibility_flags = ["nodejs_compat"]
account_id = "f3905ca6c195909711f212d3b72524a2"

[vars]
# Pública por diseño (VAPID public key) — se envía tal cual al navegador para suscribirse a
# push, no es un secret. La privada (VAPID_PRIVATE_KEY) SÍ va como wrangler secret, nunca aquí.
VAPID_PUBLIC_KEY = "BLt81jD16BvryXA9JFZxnR9ODgE4nBTkOHam407tnGnXazBFLUHFcjLn9BzrBkssd4aZ_ogT7RpuPhQ82tMV1yg"

[assets]
directory = "."
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "misantuario-db"
database_id = "85d5d951-935c-4096-9b69-7f11316dee7a"
